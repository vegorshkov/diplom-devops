all:
  hosts:
    k8s-master-ru-central1-a:
    k8s-master-ru-central1-d:
    k8s-master-ru-central1-e:
    k8s-worker-ru-central1-a:
    k8s-worker-ru-central1-d:
    k8s-worker-ru-central1-e:
  children:
    kube_control_plane:
      hosts:
        k8s-master-ru-central1-a:
        k8s-master-ru-central1-d:
        k8s-master-ru-central1-e:
    kube_node:
      hosts:
        k8s-worker-ru-central1-a:
        k8s-worker-ru-central1-d:
        k8s-worker-ru-central1-e:
    etcd:
      hosts:
        k8s-master-ru-central1-a:
        k8s-master-ru-central1-d:
        k8s-master-ru-central1-e:
    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: /home/vgorshkov/.ssh/netology-ext-key
    ansible_ssh_common_args: '-F /home/vgorshkov/.ssh/config'
    ansible_become: yes
    ansible_become_method: sudo
    ansible_become_user: root
