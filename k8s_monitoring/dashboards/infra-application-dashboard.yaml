apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-application-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  infra-application.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
