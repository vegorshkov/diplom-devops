      "refresh": "10s",
      "schemaVersion": 41,
      "tags": ["diplom", "infra", "application"],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Prometheus",
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Infra Application Overview",
      "uid": "infra-application-overview",
      "version": 1,
      "weekStart": ""
